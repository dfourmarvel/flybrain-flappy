name: Deploy demo to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "docs-site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # The page's correctness contract: the browser engine must reproduce the recorded
      # fly frame for frame, or the human-vs-fly comparison is not like-for-like.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node docs-site/parity.test.mjs
      # Live mode's engine must stay statistically equivalent to the Python model (PLAN P2).
      - run: node docs-site/live.test.mjs
        env:
          CI: "true"
      # Races logged in the browser must replay exactly, or claimed wins cannot be checked.
      - run: node docs-site/race.test.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs-site
      - id: deployment
        uses: actions/deploy-pages@v4
